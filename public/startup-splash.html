<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"
    />
    <title>Starting Silo</title>
    <style>
      :root {
        color-scheme: dark;
        --card: rgba(24, 26, 25, 0.92);
        --card-edge: rgba(255, 255, 255, 0.13);
        --text: #f4f1ed;
        --muted: #b8b2aa;
        --accent: #df9560;
        --track: rgba(255, 255, 255, 0.13);
        --button: rgba(255, 255, 255, 0.09);
        --button-hover: rgba(255, 255, 255, 0.16);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --card: rgba(250, 250, 247, 0.94);
        --card-edge: rgba(39, 43, 38, 0.15);
        --text: #20231f;
        --muted: #646a62;
        --accent: #ad5118;
        --track: rgba(36, 43, 36, 0.13);
        --button: rgba(36, 43, 36, 0.07);
        --button-hover: rgba(36, 43, 36, 0.12);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: transparent;
        color: var(--text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .splash-card {
        position: relative;
        margin: 48px 25px 18px;
        min-height: 248px;
        padding: 42px 25px 20px;
        border: 1px solid var(--card-edge);
        border-radius: 25px;
        background: var(--card);
        box-shadow: 0 22px 65px rgba(0, 0, 0, 0.3), 0 3px 12px rgba(0, 0, 0, 0.12);
        -webkit-backdrop-filter: blur(28px) saturate(1.25);
        backdrop-filter: blur(28px) saturate(1.25);
        -webkit-app-region: drag;
      }
      .brand-mark {
        position: absolute;
        top: -34px;
        left: 27px;
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border: 1px solid var(--card-edge);
        border-radius: 22px;
        background: var(--card);
        box-shadow: 0 9px 25px rgba(0, 0, 0, 0.19);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }
      .brand-mark img { width: 46px; height: 48px; object-fit: contain; }
      .wordmark {
        margin: 0 0 8px 82px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.19em;
      }
      h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.035em; }
      .explanation { margin: 7px 0 18px; max-width: 430px; color: var(--muted); }
      .status-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      #status { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; }
      #count { flex: 0 0 auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .progress-track {
        position: relative;
        height: 6px;
        margin-top: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }
      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #f0b17d);
        transition: width 220ms ease;
      }
      .progress-track.indeterminate .progress-fill {
        width: 34%;
        animation: travel 1.35s cubic-bezier(.5, 0, .35, 1) infinite;
      }
      @keyframes travel {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(315%); }
      }
      .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; color: var(--muted); font-size: 11px; }
      .minimize {
        position: absolute;
        top: 13px;
        right: 13px;
        display: grid;
        width: 29px;
        height: 29px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: var(--button);
        color: var(--muted);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .minimize:hover { background: var(--button-hover); color: var(--text); }
      .minimize:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .minimize svg { width: 14px; height: 14px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="splash-card" aria-labelledby="title">
      <div class="brand-mark"><img src="./solosilo.png" alt="" /></div>
      <button class="minimize" id="minimize" type="button" aria-label="Minimize Silo startup window" title="Minimize; click Silo in the Dock or taskbar to return">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </button>
      <p class="wordmark">SOLO · SILO EXPLORER</p>
      <h1 id="title">Opening your library</h1>
      <p class="explanation">Silo is restoring your saved library and preparing local search. You can switch to another app; Silo will keep working.</p>
      <div class="status-row">
        <span id="status" role="status" aria-live="polite">Starting Silo…</span>
        <span id="count"></span>
      </div>
      <div class="progress-track indeterminate" id="track" role="progressbar" aria-label="Silo startup progress" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" id="fill"></div>
      </div>
      <div class="footer"><span id="phase">Initializing desktop services</span><span>Original photos stay in place</span></div>
    </main>
    <script src="./startup-splash.js"></script>
  </body>
</html>
