name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'config/packaging/electron-builder.windows.config.cjs'
      - 'config/packaging/electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'electron-dist/**'
      - 'public/**'
      - 'signing/**'

permissions:
  contents: read

env:
  # Optional: Google Drive/Gmail sources ship only when these repository secrets exist.
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-windows-x64:
    name: Build unsigned Windows x64 installer
    # numkong's install step uses npm's node-gyp 11.5, which cannot yet detect
    # the VS 2026 toolchain on windows-latest. Keep native dependency builds on
    # the supported VS 2022 image until the dependency toolchain is upgraded.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Windows dependencies
        run: npm ci

      - name: Compile app
        run: npm run build

      - name: Verify bundled map asset routing
        run: npm run test:app-assets

      - name: Verify People clustering behavior
        run: npm run test:face-clustering

      - name: Smoke test bundled offline Windows semantic search
        shell: pwsh
        run: |
          $env:SILO_REAL_SEMANTIC_SMOKE = '1'
          node test/runSemanticIsolationTests.cjs

      - name: Restore cached phone tools
        id: phone-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/phone-tools/win32-x64
          key: phone-tools-win32-x64-${{ hashFiles('scripts/build-phone-tools.sh') }}

      - name: Set up MSYS2 for phone tools
        if: steps.phone-tools-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@f84a36b4009b96413f91c01441130855db9392e5 # v2.9.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            perl
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build bundled iPhone and Android tools
        if: steps.phone-tools-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-phone-tools.sh x64

      - name: Verify bundled phone tools
        shell: pwsh
        run: |
          $dir = 'vendor/phone-tools/win32-x64'
          foreach ($tool in 'adb.exe','AdbWinApi.dll','idevice_id.exe','ideviceinfo.exe','idevicepair.exe','afcclient.exe','idevicebackup2.exe') {
            if (-not (Test-Path (Join-Path $dir $tool))) { throw "Missing bundled phone tool: $tool" }
          }
          & (Join-Path $dir 'adb.exe') version
          & (Join-Path $dir 'idevice_id.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'idevice_id.exe does not run outside MSYS2 (missing DLL?)' }

      - name: Package and verify NSIS installer
        shell: pwsh
        run: |
          $hook = Join-Path $env:RUNNER_TEMP 'silo-installer-progress.nsh'
          $sharpRuntimePackage = 'node_modules/@img/sharp-win32-x64'
          $sharpPackageMetadata = Get-Content (Join-Path $sharpRuntimePackage 'package.json') -Raw | ConvertFrom-Json
          $sharpVersions = Get-Content (Join-Path $sharpRuntimePackage 'versions.json') -Raw | ConvertFrom-Json
          $sharpNativeFile = "sharp-win32-x64-$($sharpPackageMetadata.version).node"
          $libvipsCppFile = "libvips-cpp-$($sharpVersions.vips).dll"
          $hookContent = @'
          !macro customInstall
            SetDetailsView show
            SetDetailsPrint both
            DetailPrint "Checking that the Silo desktop app is ready to launch..."
            ${IfNot} ${FileExists} "$INSTDIR\${APP_EXECUTABLE_FILENAME}"
              MessageBox MB_ICONSTOP "Silo could not verify its desktop app. Setup will stop so you do not get an incomplete install."
              Abort
            ${EndIf}
            DetailPrint "Tuning Silo's offline semantic search engine..."
            ${IfNot} ${FileExists} "$INSTDIR\resources\clip-model-cache\Xenova\clip-vit-base-patch32\onnx\text_model_quantized.onnx"
              MessageBox MB_ICONSTOP "Silo's offline text search model is missing. Setup will stop rather than install a broken search feature."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\clip-model-cache\Xenova\clip-vit-base-patch32\onnx\vision_model_quantized.onnx"
              MessageBox MB_ICONSTOP "Silo's offline photo search model is missing. Setup will stop rather than install a broken search feature."
              Abort
            ${EndIf}
            DetailPrint "Checking the local ONNX runtime that powers photo and text matching..."
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\onnxruntime-web\dist\ort-wasm-simd-threaded.asyncify.wasm"
              MessageBox MB_ICONSTOP "Silo's local semantic runtime is missing. Setup will stop so search works after installation."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\onnxruntime-web\dist\ort-wasm-simd-threaded.asyncify.mjs"
              MessageBox MB_ICONSTOP "Silo's local semantic runtime loader is missing. Setup will stop so search works after installation."
              Abort
            ${EndIf}
            DetailPrint "Verifying the offline face and people analysis models..."
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-models\tiny_face_detector_model-weights_manifest.json"
              MessageBox MB_ICONSTOP "Silo's bundled face analysis model is missing. Setup will stop rather than install an incomplete app."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-models\tiny_face_detector_model.bin"
              MessageBox MB_ICONSTOP "Silo's bundled face detector weights are missing. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-models\face_landmark_68_model.bin"
              MessageBox MB_ICONSTOP "Silo's bundled face landmark model is missing. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-models\face_recognition_model.bin"
              MessageBox MB_ICONSTOP "Silo's bundled face recognition model is missing. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-wasm\tfjs-backend-wasm.wasm"
              MessageBox MB_ICONSTOP "Silo's offline face runtime is missing. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-wasm\tfjs-backend-wasm-simd.wasm"
              MessageBox MB_ICONSTOP "Silo's offline face runtime is incomplete. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\face-wasm\tfjs-backend-wasm-threaded-simd.wasm"
              MessageBox MB_ICONSTOP "Silo's offline face runtime is incomplete. Setup will stop rather than install broken People analysis."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\ffmpeg-static\ffmpeg.exe"
              MessageBox MB_ICONSTOP "Silo's bundled FFmpeg is missing. Setup will stop rather than install broken Memories export."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\@img\sharp-win32-x64\lib\__SHARP_NATIVE_FILE__"
              MessageBox MB_ICONSTOP "Silo's Windows image runtime is missing. Setup will stop rather than install broken image processing."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\@img\sharp-win32-x64\lib\libvips-42.dll"
              MessageBox MB_ICONSTOP "Silo's Windows image library is missing. Setup will stop rather than install broken image processing."
              Abort
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\resources\app.asar.unpacked\node_modules\@img\sharp-win32-x64\lib\__LIBVIPS_CPP_FILE__"
              MessageBox MB_ICONSTOP "Silo's Windows image library is incomplete. Setup will stop rather than install broken image processing."
              Abort
            ${EndIf}
            DetailPrint "Silo's core offline features are in place; your library stays on this PC."
            SetDetailsPrint none
          !macroend
          '@
          $hookContent = $hookContent.Replace('__SHARP_NATIVE_FILE__', $sharpNativeFile)
          $hookContent = $hookContent.Replace('__LIBVIPS_CPP_FILE__', $libvipsCppFile)
          $hookContent | Set-Content -Path $hook -Encoding Ascii
          $env:SILO_NSIS_INCLUDE = $hook
          npx electron-builder --config config/packaging/electron-builder.windows.config.cjs --win nsis --x64 --publish never

          $appExe = 'release/win-unpacked/Silo.exe'
          $resources = 'release/win-unpacked/resources'
          $sharpRuntimeResource = "$resources/app.asar.unpacked/node_modules/@img/sharp-win32-x64/lib"
          $required = @(
            $appExe,
            "$resources/google.env",
            "$resources/clip-model-cache/Xenova/clip-vit-base-patch32/tokenizer.json",
            "$resources/clip-model-cache/Xenova/clip-vit-base-patch32/onnx/text_model_quantized.onnx",
            "$resources/clip-model-cache/Xenova/clip-vit-base-patch32/onnx/vision_model_quantized.onnx",
            "$resources/face-models/tiny_face_detector_model-weights_manifest.json",
            "$resources/face-models/tiny_face_detector_model.bin",
            "$resources/face-models/face_landmark_68_model-weights_manifest.json",
            "$resources/face-models/face_landmark_68_model.bin",
            "$resources/face-models/face_recognition_model-weights_manifest.json",
            "$resources/face-models/face_recognition_model.bin",
            "$resources/face-wasm/tfjs-backend-wasm.wasm",
            "$resources/face-wasm/tfjs-backend-wasm-simd.wasm",
            "$resources/face-wasm/tfjs-backend-wasm-threaded-simd.wasm",
            "$resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe",
            "$sharpRuntimeResource/$sharpNativeFile",
            "$resources/app.asar.unpacked/node_modules/@img/sharp-win32-x64/lib/libvips-42.dll",
            "$sharpRuntimeResource/$libvipsCppFile",
            "$resources/app.asar.unpacked/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm",
            "$resources/app.asar.unpacked/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs"
          )
          foreach ($asset in $required) {
            if (-not (Test-Path $asset)) { throw "Missing packaged Silo asset: $asset" }
          }
          node test/runWindowsPackageAssets.cjs 'release/win-unpacked/resources'
          node test/runWindowsPackagedSharpSmoke.cjs 'release/win-unpacked/resources'
          node test/runWindowsFaceRuntimeSmoke.cjs 'release/win-unpacked/resources'
          node test/runWindowsGeoRuntimeSmoke.cjs
          node test/runWindowsMemoryRuntimeSmoke.cjs 'release/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe'

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows x64 setup executable was produced.' }
          Get-FileHash $installer.FullName -Algorithm SHA256
          Get-ChildItem release | Select-Object Name, Length

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silo-windows-x64
          path: |
            release/*-Setup.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
