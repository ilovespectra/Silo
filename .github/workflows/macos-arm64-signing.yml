name: macOS arm64 signing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macos-arm64-signing.yml'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'signing/**'
      - 'scripts/**'
      - 'src/**'
      - 'electron-dist/**'
      - 'public/**'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Build an ad hoc DMG or request Developer ID signing
        type: choice
        options:
          - adhoc
          - developer-id
        default: adhoc
        required: true

permissions:
  contents: read

jobs:
  build-adhoc:
    name: Build and assess ad hoc Silo arm64 DMG
    if: github.event_name == 'pull_request' || inputs.signing_mode == 'adhoc'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: npm ci

      - name: Build app files
        run: npm run build

      - name: Package arm64 ad hoc DMG
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg --arm64 --publish never

      - name: Verify ad hoc signature and assess Gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if spctl -a -t exec -vv "$app_path"; then
            echo 'Gatekeeper accepted this ad hoc build; review the assessment above.'
          else
            echo 'Gatekeeper rejection is expected for an ad hoc build.'
          fi
          if xcrun stapler validate "$app_path"; then
            echo 'An ad hoc build unexpectedly has an app notarization ticket.' >&2
            exit 1
          else
            echo 'No app ticket is expected for an ad hoc build.'
          fi
          if xcrun stapler validate "$dmg_path"; then
            echo 'An ad hoc build unexpectedly has a DMG notarization ticket.' >&2
            exit 1
          else
            echo 'No DMG ticket is expected for an ad hoc build.'
          fi

      - name: Upload ad hoc DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-macos-arm64-adhoc
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-developer-id:
    name: Sign, notarize, and assess Silo arm64 DMG
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signing_mode == 'developer-id'
    runs-on: macos-15
    environment:
      name: macos-signing
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: npm ci

      - name: Build app files
        run: npm run build

      - name: Select signing mode from protected environment secrets
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
            echo 'All protected signing secrets are present.'
          else
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets are incomplete; this run will produce an ad hoc DMG.'
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/silo-developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate_path"
          test -s "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Package Developer ID arm64 DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg --arm64 --publish never

      - name: Package ad hoc arm64 DMG fallback
        if: steps.signing.outputs.mode == 'adhoc'
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg --arm64 --publish never

      - name: Notarize and staple Developer ID DMG
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool store-credentials silo-notarization \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile silo-notarization \
            --wait \
            --output-format json
          xcrun stapler staple "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify Developer ID signature, Gatekeeper, and notarization
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$DMG_PATH"
          test -f "$dmg_path"
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -t exec -vv "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify ad hoc fallback signature and Gatekeeper
        if: steps.signing.outputs.mode == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if spctl -a -t exec -vv "$app_path"; then
            echo 'Gatekeeper accepted the ad hoc fallback; review the assessment above.'
          else
            echo 'Gatekeeper rejection is expected for an ad hoc fallback.'
          fi
          if xcrun stapler validate "$app_path"; then
            echo 'An ad hoc fallback unexpectedly has an app ticket.' >&2
            exit 1
          else
            echo 'No app ticket is expected for the ad hoc fallback.'
          fi
          if xcrun stapler validate "$dmg_path"; then
            echo 'An ad hoc fallback unexpectedly has a DMG ticket.' >&2
            exit 1
          else
            echo 'No DMG ticket is expected for the ad hoc fallback.'
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-macos-arm64-${{ steps.signing.outputs.mode }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
