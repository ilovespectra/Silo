name: macOS arm64 signing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macos-arm64-signing.yml'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'signing/**'
      - 'scripts/**'
      - 'src/**'
      - 'electron-dist/**'
      - 'public/**'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Build an ad hoc DMG or request Developer ID signing
        type: choice
        options:
          - adhoc
          - developer-id
        default: adhoc
        required: true

permissions:
  contents: read

env:
  # Optional: Google Drive/Gmail sources ship only when these repository secrets exist.
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-adhoc:
    name: Build and assess ad hoc Silo arm64 DMG
    if: github.event_name == 'pull_request' || inputs.signing_mode == 'adhoc'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: npm ci

      - name: Build bundled iPhone and Android tools
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          bash scripts/build-phone-tools.sh arm64

      - name: Build app files
        run: npm run build

      - name: Import Silo's stable signing identity
        shell: bash
        env:
          SILO_MAC_SIGNING_P12_BASE64: ${{ secrets.SILO_MAC_SIGNING_P12_BASE64 }}
          SILO_MAC_SIGNING_P12_PASSWORD: ${{ secrets.SILO_MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SILO_MAC_SIGNING_P12_BASE64" ]; then
            echo "No stable signing identity secret; this build is ad hoc and updates to it reset macOS permissions."
            exit 0
          fi
          keychain="$RUNNER_TEMP/silo-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$SILO_MAC_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/silo-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/silo-signing.p12" -k "$keychain" -P "$SILO_MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/silo-signing.p12"
          echo "::add-mask::$password"
          echo "SILO_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SILO_MAC_SIGNING_KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Package arm64 ad hoc DMG
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --arm64 --publish never

      - name: Verify Google sign-in config is bundled
        shell: bash
        run: |
          set -euo pipefail
          config=$(find release -path '*Silo.app/Contents/Resources/google.env' -print -quit)
          if [ -z "$config" ]; then
            echo "::error::google.env is missing. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets."
            exit 1
          fi
          grep -q '^GOOGLE_CLIENT_ID=.\+' "$config"
          grep -q '^GOOGLE_CLIENT_SECRET=.\+' "$config"

      - name: Verify the macOS updater ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          zip_path="release/Silo-${package_version}-arm64.zip"
          test -s "$zip_path"
          test -s release/latest-mac.yml
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const yaml = require('js-yaml');
          const manifest = yaml.load(fs.readFileSync('release/latest-mac.yml', 'utf8'));
          assert.ok(manifest.files.some((file) => file.url.endsWith('-arm64.zip')));
          console.log('macOS updater ZIP and latest-mac.yml are present.');
          NODE

      - name: Verify ad hoc signature and assess Gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          echo 'Gatekeeper assessment for opening the ad hoc DMG:'
          if spctl -a -t open --context context:primary-signature -vv "$dmg_path"; then
            echo 'Gatekeeper accepted opening this ad hoc DMG; review the assessment above.'
          else
            echo 'Gatekeeper rejected opening this ad hoc DMG; it is not warning-free for direct distribution.'
          fi
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if spctl -a -t exec -vv "$app_path"; then
            echo 'Gatekeeper accepted launching this ad hoc app; review the assessment above.'
          else
            echo 'Gatekeeper rejected launching this ad hoc app; it is not warning-free for direct distribution.'
          fi
          if xcrun stapler validate "$app_path"; then
            echo 'An ad hoc build unexpectedly has an app notarization ticket.' >&2
            exit 1
          else
            echo 'No app ticket is expected for an ad hoc build.'
          fi
          if xcrun stapler validate "$dmg_path"; then
            echo 'An ad hoc build unexpectedly has a DMG notarization ticket.' >&2
            exit 1
          else
            echo 'No DMG ticket is expected for an ad hoc build.'
          fi

      - name: Upload ad hoc DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-macos-arm64-adhoc
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-developer-id:
    name: Sign, notarize, and assess Silo arm64 DMG
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signing_mode == 'developer-id'
    runs-on: macos-15
    environment:
      name: macos-signing
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: npm ci

      - name: Build bundled iPhone and Android tools
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          bash scripts/build-phone-tools.sh arm64

      - name: Build app files
        run: npm run build

      - name: Import Silo's stable signing identity
        shell: bash
        env:
          SILO_MAC_SIGNING_P12_BASE64: ${{ secrets.SILO_MAC_SIGNING_P12_BASE64 }}
          SILO_MAC_SIGNING_P12_PASSWORD: ${{ secrets.SILO_MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SILO_MAC_SIGNING_P12_BASE64" ]; then
            echo "No stable signing identity secret; this build is ad hoc and updates to it reset macOS permissions."
            exit 0
          fi
          keychain="$RUNNER_TEMP/silo-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$SILO_MAC_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/silo-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/silo-signing.p12" -k "$keychain" -P "$SILO_MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/silo-signing.p12"
          echo "::add-mask::$password"
          echo "SILO_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SILO_MAC_SIGNING_KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Select signing mode from protected environment secrets
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo 'mode=developer-id' >> "$GITHUB_OUTPUT"
            echo 'All protected signing secrets are present.'
          else
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets are incomplete; this run will produce an ad hoc DMG.'
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/silo-developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate_path"
          test -s "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Package Developer ID arm64 DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --arm64 --publish never

      - name: Package ad hoc arm64 DMG fallback
        if: steps.signing.outputs.mode == 'adhoc'
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --arm64 --publish never

      - name: Verify Google sign-in config is bundled
        shell: bash
        run: |
          set -euo pipefail
          config=$(find release -path '*Silo.app/Contents/Resources/google.env' -print -quit)
          if [ -z "$config" ]; then
            echo "::error::google.env is missing. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets."
            exit 1
          fi
          grep -q '^GOOGLE_CLIENT_ID=.\+' "$config"
          grep -q '^GOOGLE_CLIENT_SECRET=.\+' "$config"

      - name: Verify the macOS updater ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          zip_path="release/Silo-${package_version}-arm64.zip"
          test -s "$zip_path"
          test -s release/latest-mac.yml
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const yaml = require('js-yaml');
          const manifest = yaml.load(fs.readFileSync('release/latest-mac.yml', 'utf8'));
          assert.ok(manifest.files.some((file) => file.url.endsWith('-arm64.zip')));
          console.log('macOS updater ZIP and latest-mac.yml are present.');
          NODE

      - name: Notarize and staple Developer ID DMG
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool store-credentials silo-notarization \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile silo-notarization \
            --wait \
            --output-format json
          xcrun stapler staple "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify Developer ID signature, Gatekeeper, and notarization
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$DMG_PATH"
          test -f "$dmg_path"
          echo 'Gatekeeper assessment for opening the Developer ID DMG:'
          spctl -a -t open --context context:primary-signature -vv "$dmg_path"
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          echo 'Gatekeeper assessment for launching the Developer ID app:'
          spctl -a -t exec -vv "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify ad hoc fallback signature and Gatekeeper
        if: steps.signing.outputs.mode == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          echo 'Gatekeeper assessment for opening the ad hoc fallback DMG:'
          if spctl -a -t open --context context:primary-signature -vv "$dmg_path"; then
            echo 'Gatekeeper accepted opening the ad hoc fallback DMG; review the assessment above.'
          else
            echo 'Gatekeeper rejected opening the ad hoc fallback DMG; it is not warning-free for direct distribution.'
          fi
          mount_point="$RUNNER_TEMP/silo-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app_path="$mount_point/Silo.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          echo 'Gatekeeper assessment for launching the ad hoc fallback app:'
          if spctl -a -t exec -vv "$app_path"; then
            echo 'Gatekeeper accepted launching the ad hoc fallback app; review the assessment above.'
          else
            echo 'Gatekeeper rejected launching the ad hoc fallback app; it is not warning-free for direct distribution.'
          fi
          if xcrun stapler validate "$app_path"; then
            echo 'An ad hoc fallback unexpectedly has an app ticket.' >&2
            exit 1
          else
            echo 'No app ticket is expected for the ad hoc fallback.'
          fi
          if xcrun stapler validate "$dmg_path"; then
            echo 'An ad hoc fallback unexpectedly has a DMG ticket.' >&2
            exit 1
          else
            echo 'No DMG ticket is expected for the ad hoc fallback.'
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-macos-arm64-${{ steps.signing.outputs.mode }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
